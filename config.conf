# config.conf
# Configuration file for BIS-TECH AUTO SCRIPT
# This file is sourced by menu.sh and modules/update.sh

SCRIPT_NAME="BIS-TECH AUTO SCRIPT"
SCRIPT_VERSION="1.0.0"
AUTHOR="BIS-TECH TECHNOLOGIES"
GITHUB_REPO="bistech-dev/BIS-TECH-TECHNOLOGIES-AUTO-SCRIPT"

# Installation directory (must match install.sh)
INSTALL_DIR="/opt/bis-tech"

# Directory where backups are stored
BACKUP_DIR="/opt/bis-tech/backups"

# Optional domain shown on the dashboard (e.g. if you point a domain at
# this VPS for a reverse proxy setup). Leave blank if not applicable.
DOMAIN=""

# ---------- Trial / Licensing ----------
# Trial duration - set a number and a unit. Unit can be "minutes",
# "hours", or "days". Minutes/hours are handy for testing the expiry
# flow quickly; days is what you'd actually ship to customers.
TRIAL_DURATION_VALUE=3
TRIAL_DURATION_UNIT="days"

# Secret used to validate license keys (modules/license.sh).
# CHANGE THIS before selling the script, and keep it out of any public repo.
LICENSE_SECRET="CHANGE_ME_BEFORE_SELLING"

# Where the trial start date and activated license are recorded.
# Deliberately stored outside INSTALL_DIR so uninstalling/reinstalling
# the tool does not reset the trial clock.
TRIAL_MARKER_FILE="/etc/.bistech_trial_start"
LICENSE_FILE="/etc/.bistech_license"

# Admin password hash (SHA-256) required to generate new license
# keys from within the menu via option 21. Only you should know the
# actual password - this file stores just the hash, never the
# plaintext. Keep this repo private if it isn't already.
ADMIN_PASSWORD_HASH="057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86"

# ---------- Optional third-party service installers ----------
# SSH UDP and ZIVPN don't have one single official upstream the way
# Xray does, so nothing is installed from a hardcoded source by
# default. If you have a specific install script you trust, put its
# raw URL here and the menu's "Install Service" option will fetch and
# run it - review whatever you link to before relying on it, since it
# runs as root on the VPS. Leave blank to keep these manage-only.
SSHUDP_INSTALL_URL=""
ZIVPN_INSTALL_URL=""

# UDP tunnel port shown on SSH UDP account details (e.g. badvpn-udpgw
# style tools commonly use 7300). Adjust to match whatever SSH UDP
# tool you actually install.
SSHUDP_PORT="7300"

# UDP port shown on ZIVPN account details. 5667 is the commonly cited
# default across public ZIVPN scripts, but confirm against whichever
# ZIVPN build you actually install and adjust if it differs.
ZIVPN_PORT="5667"
